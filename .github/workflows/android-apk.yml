name: Compilar APK Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'main.py'
      - 'controller.py'
      - 'engine/**'
      - 'assets/**'
      - 'buildozer.spec'
      - '.github/workflows/android-apk.yml'
jobs:
  debug-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar herramientas
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config cmake \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 libffi-dev libssl-dev \
            automake autopoint gettext libltdl-dev
          python -m pip install --upgrade pip
          python -m pip install buildozer cython virtualenv
          python -m pip install 'kivy==2.3.1'
      - name: Probar motor y adaptador
        run: bash ./ejecutar_pruebas.sh
      - name: Verificar arranque de interfaz Kivy en Xvfb
        env:
          KIVY_NO_ARGS: '1'
          KIVY_NO_FILELOG: '1'
        run: xvfb-run -a python -u smoke_ui.py
      - name: Compilar APK sin firma de distribución (debug)
        run: buildozer -v android debug
      - uses: actions/upload-artifact@v4
        with:
          name: TEG-La-Revancha-APK-debug
          path: bin/*.apk
          if-no-files-found: error
